name: Deploy static website

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: true
        # Deploy the commit of the caller workflow
        ref: ${{ github.sha }}
    - uses: ruby/setup-ruby@v1 # use .ruby-version
    - name: (project) Install
      run: |
        echo "** Install ruby dependencies:"
        make install
    - name: (project) Build
      run: |
        source ~/.profile
        make build-prod
        cp .github/files/* ./build/static-files/
    - name: (project) Deploy
      run: |
        git add --force ./build/static-files
        git stash --keep-index --include-untracked
        git stash save -m "Deploy static website"
        git fetch --all
        git checkout gh-pages
        git rm -rf --quiet .
        git stash pop --quiet
        mv ./build/static-files/* . # Only resources whose names don't start with a dot "."
        git add -A
        git config user.email ""
        git config user.name "GitHub Actions"
        git commit -m "Deploy static website" --author="GitHub Actions <>" --quiet
        git push
